<!DOCTYPE html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Termômetro da Alegria</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <h1>🌱 Termômetro da Alegria</h1>

    <div id="container">
      <div id="barra"></div>
    </div>

    <p id="nivel">Nível: 0</p>

    <div class="controles">
      <button id="btnAumentar">➕ Aumentar Alegria</button>
      <button id="btnResetar">🔄 Reiniciar</button>
      <button id="btnFinalizar">🏁 Finalizar Reflexão</button>
    </div>

    <div id="resultado" style="display: none">
      <h2 id="mensagem"></h2>
      <img id="imagemResultado" alt="Resultado" />
      <p id="versiculo"></p>
      <p id="conselho"></p>
    </div>
  </body>
</html>
