<!DOCTYPE html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <title>Termômetro da Alegria</title>
    <link rel="stylesheet" href="style.css" />
    <script src="./script.js" defer></script>
  </head>

  <body>
    <h1>🌱 Termômetro da Alegria</h1>

    <div id="container">
      <div id="barra"></div>
    </div>

    <p id="nivel">Nivel: 0</p>

    <button id="btnAumentar">+ Alegria</button>
    <button id="btnResetar">Resetar</button>
    <button id="btnFinalizar">Finalizar</button>

    <div id="resultado" style="display: none">
      <h2 id="mensagem"></h2>
      <p id="conselho" style="white-space: pre-line; margin-top: 15px"></p>
      <p id="versiculo" style="font-style: italic; margin: 15px 0"></p>

      <img id="imagemResultado" width="250" />
    </div>
  </body>
</html>
