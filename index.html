<!DOCTYPE html>
<html lang="pt-Br">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no"
    />
    <title>Termômetro da Alegria</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Poppins:ital,wght@0,100;0,200;0,300;0,400;0,500;0,600;0,700;0,800;0,900;1,100;1,200;1,300;1,400;1,500;1,600;1,700;1,800;1,900&family=Roboto:ital,wght@0,100..900;1,100..900&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="style.css" />

    <script src="./script.js" defer></script>
  </head>

  <body>
    <h1>🌱 Termômetro da Alegria</h1>

    <div id="container">
      <div id="barra"></div>
    </div>

    <p id="nivel">Nível: 0</p>

    <div class="controles">
      <button id="btnAumentar">➕ Aumentar Alegria</button>
      <button id="btnResetar">🔄 Reiniciar</button>
      <button id="btnFinalizar">🏁 Finalizar Reflexão</button>
    </div>

    <div id="resultado" style="display: none">
      <h2 id="mensagem"></h2>
      <img id="imagemResultado" alt="Resultado" />
      <p id="versiculo"></p>
      <p id="conselho"></p>
    </div>
    <div id="notificacao" class="oculta">
      <span id="textoNotificacao"></span>
    </div>
  </body>
</html>
